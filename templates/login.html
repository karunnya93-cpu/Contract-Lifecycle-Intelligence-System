{% extends "base.html" %}

{% block title %}Login | AI Contract Intelligence{% endblock %}

{% block body %}
<main class="auth-page">
    <section class="auth-card shadow">
        <a class="brand-link" href="{{ url_for('index') }}">
            <i class="bi bi-shield-check"></i>
            <span>Contract Intelligence</span>
        </a>

        <h1 class="h3 fw-bold mt-4">Sign in</h1>
        <p class="text-secondary">Access your secure contract dashboard.</p>

        {% include "_flash.html" %}

        <form method="post" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="email">Email address</label>
                <input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" id="remember" name="remember" type="checkbox">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
        </p>
    </section>
</main>
{% endblock %}
